# Source registry. Priority order per spec §6:
#   HF structured datasets (bootstrap, M1) -> FGV/OAB PDFs (M2) -> Cebraspe (M3) -> MP/TJ pages (M3)
#
# Only public, official (or officially mirrored) sources. No commercial aggregators.
#
# The filter values below were verified against the live datasets on 2026-08-05 and
# differ from the spec draft — see docs/superpowers/plans/ for the correction table.
sources:
  - id: hf-oab-exams
    adapter: hf_datasets
    dataset: eduagarcia/oab_exams
    config: default
    split: train
    # The column is `question_type`; values are UPPER-HYPHEN codes, not prose.
    # CRIMINAL is kept alongside CRIMINAL-PROCEDURE because many CRIMINAL items turn
    # on procedural reasoning; the classify stage decides discipline, not this filter.
    question_type_filter: ["CRIMINAL-PROCEDURE", "CRIMINAL"]
    banca: FGV
    carreira: oab
    notes: >
      Bootstrap source. 2,210 rows total, 177 in the criminal slice, exams 2010-2018.
      Every item predates the Pacote Anticrime (2020-01-23), so the law watchlist in
      the vetting stage is load-bearing for this source.

  - id: hf-oab-bench
    adapter: hf_datasets
    dataset: maritaca-ai/oab-bench
    config: questions
    guidelines_config: guidelines
    split: train
    # `category` is "{exam_number}_{discipline}", e.g. "39_direito_penal".
    category_suffix_filter: ["direito_penal"]
    banca: FGV
    carreira: oab
    # The dataset carries no year column, so the year is supplied here or the law
    # watchlist can never fire for this source (spec §10.1).
    #
    # These are the dates the *2ª fase* was actually applied, which is what the
    # watchlist rule means by "when the question was written" — not the year the
    # exame is colloquially named after. The two diverge: the 39º EOU sat its 1ª
    # fase in Dec/2023 but its prova prático-profissional in Jan/2024.
    # Extend this as new exams are harvested.
    exam_years:
      39: 2024   # 2ª fase 21/01/2024
      40: 2024   # 2ª fase 19/05/2024
      41: 2024   # 2ª fase 22/09/2024
      42: 2025   # 2ª fase 16/02/2025
      43: 2025   # 2ª fase 15/06/2025
      44: 2025   # 2ª fase 19/10/2025
    notes: >
      Discursive bootstrap, 30 penal rows (OAB 2a fase). Official examiner guidelines
      live in a separate `guidelines` config, joined on question_id, and land in
      answer_rationale. Check the dataset licence before redistributing.

  - id: oab-2f-penal
    adapter: oab_site
    # Spec §6 names this source `fgv-oab` at https://oab.fgv.br. That site is dead
    # for harvesting: every home.aspx?key=N returns the same 7 kB ASP.NET shell with
    # a seccional dropdown and no PDF links. The Conselho Federal da OAB publishes
    # the byte-identical files over plain GET, so we fetch there. FGV is still the
    # banca; the OAB is only the host.
    seed_url: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame=0
    exam_url_template: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame={exam_id}
    area: Direito Penal
    banca: FGV
    carreira: oab
    # Spec §6 requires <= 1 request/second per host; 1.5 s gives headroom. A full
    # sweep is 47 index GETs + 45 PDFs, so roughly two and a half minutes.
    min_interval_seconds: 1.5
    notes: >
      OAB 2ª fase, Direito Penal. The "Padrão de respostas" is self-contained —
      Enunciado (the question verbatim) plus the banca's own Gabarito Comentado —
      so there is no prova/gabarito pair to join; one PDF per exam is the whole
      artifact. 45 of 46 exams publish one (34 definitivo, 11 preliminary only);
      the 47º is mid-cycle. Measured yield: 175 sections across 35 exams, 139 of
      them with both a stem and a rationale.

  - id: cebraspe-cadernos
    adapter: cebraspe
    # Spec §6 assumes a hand-curated allow-list scraped from HTML. Cebraspe exposes an
    # unauthenticated JSON API instead (robots.txt disallows nothing; no terms-of-use
    # page exists on either host), so discovery is three deterministic GETs.
    seed_url: https://apis.cebraspe.org.br/cebraspe/eventos/tipo/concursos/
    event_url_template: https://apis.cebraspe.org.br/cebraspe/eventos/{slug}
    columns: 2
    min_interval_seconds: 1.5
    banca: CEBRASPE
    # Explicit allow-list, per spec §6. Of 88 legal-career certames whose manifests
    # parse, only these two publish the combined caderno — item text, answer key and
    # the banca's justificativa in one self-contained file. Sweeping all 490 events was
    # done once, offline, to build this list; re-running it belongs to the widening
    # milestone, not to the pipeline.
    certames:
      - slug: PC_DF_26_DELEGADO
        carreira: delegado
        certame: PC/DF Delegado 2026
        exam_year: 2026
      - slug: DP_DF_19_DEFENSOR
        carreira: defensoria
        certame: DP/DF Defensor 2019
        exam_year: 2019
    notes: >
      Certo/errado items with per-item banca rationale. Items are governed by a shared
      comando; it is stored in stem_context, never prefixed to the stem, because a real
      comando outruns stem_hash's window. Items whose comando points back at narrative
      the item does not carry are skipped (the professor's scope decision).

  - id: manual-provas
    adapter: generic_pdf
    # Literal, hand-verified URLs in config/provas_manifest.yaml. Never construct one
    # by pattern: MPRS ordinal substitution 404s and MPF's returns 401.
    manifest: provas_manifest.yaml
    min_interval_seconds: 1.5
    notes: >
      Official provas from public bodies that publish their own concursos. Each entry
      is self-contained — the answer grid is either inside the prova or a companion
      file named in the entry — so there is no discovery step to break.

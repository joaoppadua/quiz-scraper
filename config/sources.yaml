# Source registry. Priority order per spec §6:
#   HF structured datasets (bootstrap, M1) -> FGV/OAB PDFs (M2) -> Cebraspe (M3) -> MP/TJ pages (M3)
#
# Only public, official (or officially mirrored) sources. No commercial aggregators.
#
# The filter values below were verified against the live datasets on 2026-08-05 and
# differ from the spec draft — see docs/superpowers/plans/ for the correction table.
sources:
  - id: hf-oab-exams
    adapter: hf_datasets
    dataset: eduagarcia/oab_exams
    config: default
    split: train
    # The column is `question_type`; values are UPPER-HYPHEN codes, not prose.
    # CRIMINAL is kept alongside CRIMINAL-PROCEDURE because many CRIMINAL items turn
    # on procedural reasoning; the classify stage decides discipline, not this filter.
    question_type_filter: ["CRIMINAL-PROCEDURE", "CRIMINAL"]
    banca: FGV
    carreira: oab
    notes: >
      Bootstrap source. 2,210 rows total, 177 in the criminal slice, exams 2010-2018.
      Every item predates the Pacote Anticrime (2020-01-23), so the law watchlist in
      the vetting stage is load-bearing for this source.

  - id: hf-oab-bench
    adapter: hf_datasets
    dataset: maritaca-ai/oab-bench
    config: questions
    guidelines_config: guidelines
    split: train
    # `category` is "{exam_number}_{discipline}", e.g. "39_direito_penal".
    category_suffix_filter: ["direito_penal"]
    banca: FGV
    carreira: oab
    # The dataset carries no year column, so the year is supplied here or the law
    # watchlist can never fire for this source (spec §10.1).
    #
    # These are the dates the *2ª fase* was actually applied, which is what the
    # watchlist rule means by "when the question was written" — not the year the
    # exame is colloquially named after. The two diverge: the 39º EOU sat its 1ª
    # fase in Dec/2023 but its prova prático-profissional in Jan/2024.
    # Extend this as new exams are harvested.
    exam_years:
      39: 2024   # 2ª fase 21/01/2024
      40: 2024   # 2ª fase 19/05/2024
      41: 2024   # 2ª fase 22/09/2024
      42: 2025   # 2ª fase 16/02/2025
      43: 2025   # 2ª fase 15/06/2025
      44: 2025   # 2ª fase 19/10/2025
    notes: >
      Discursive bootstrap, 30 penal rows (OAB 2a fase). Official examiner guidelines
      live in a separate `guidelines` config, joined on question_id, and land in
      answer_rationale. Check the dataset licence before redistributing.

  - id: oab-2f-penal
    adapter: oab_site
    # Spec §6 names this source `fgv-oab` at https://oab.fgv.br. That site is dead
    # for harvesting: every home.aspx?key=N returns the same 7 kB ASP.NET shell with
    # a seccional dropdown and no PDF links. The Conselho Federal da OAB publishes
    # the byte-identical files over plain GET, so we fetch there. FGV is still the
    # banca; the OAB is only the host.
    seed_url: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame=0
    exam_url_template: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame={exam_id}
    area: Direito Penal
    banca: FGV
    carreira: oab
    # Spec §6 requires <= 1 request/second per host; 1.5 s gives headroom. A full
    # sweep is 47 index GETs + 45 PDFs, so roughly two and a half minutes.
    min_interval_seconds: 1.5
    notes: >
      OAB 2ª fase, Direito Penal. The "Padrão de respostas" is self-contained —
      Enunciado (the question verbatim) plus the banca's own Gabarito Comentado —
      so there is no prova/gabarito pair to join; one PDF per exam is the whole
      artifact. 45 of 46 exams publish one (34 definitivo, 11 preliminary only);
      the 47º is mid-cycle. Measured yield: 175 sections across 35 exams, 139 of
      them with both a stem and a rationale.

  - id: cebraspe-cadernos
    adapter: cebraspe
    # Spec §6 assumes a hand-curated allow-list scraped from HTML. Cebraspe exposes an
    # unauthenticated JSON API instead (robots.txt disallows nothing; no terms-of-use
    # page exists on either host), so discovery is three deterministic GETs.
    seed_url: https://apis.cebraspe.org.br/cebraspe/eventos/tipo/concursos/
    event_url_template: https://apis.cebraspe.org.br/cebraspe/eventos/{slug}
    columns: 2
    min_interval_seconds: 1.5
    banca: CEBRASPE
    # Explicit allow-list, per spec §6. Of 88 legal-career certames whose manifests
    # parse, only these two publish the combined caderno — item text, answer key and
    # the banca's justificativa in one self-contained file. Sweeping all 490 events was
    # done once, offline, to build this list; re-running it belongs to the widening
    # milestone, not to the pipeline.
    certames:
      # PC_DF_26_DELEGADO's file is published as "PROVA OBJETIVA (P1) E GABARITO
      # PRELIMINAR COM JUSTIFICATIVAS" — its answer key carries the same
      # subject-to-recursos exposure that Question.answer_key_provisional exists to
      # flag (M2.5). Setting the flag here is deliberately out of scope for M2.5:
      # this is an M3-owned adapter, and an M2.5 task must not rewrite its rows.
      # Deferred — its own commit, if the professor wants it.
      - slug: PC_DF_26_DELEGADO
        carreira: delegado
        certame: PC/DF Delegado 2026
        exam_year: 2026
      - slug: DP_DF_19_DEFENSOR
        carreira: defensoria
        certame: DP/DF Defensor 2019
        exam_year: 2019
    notes: >
      Certo/errado items with per-item banca rationale. Items are governed by a shared
      comando; it is stored in stem_context, never prefixed to the stem, because a real
      comando outruns stem_hash's window. Items whose comando points back at narrative
      the item does not carry are skipped (the professor's scope decision).

  - id: manual-provas
    adapter: generic_pdf
    # Literal, hand-verified URLs in config/provas_manifest.yaml. Never construct one
    # by pattern: MPRS ordinal substitution 404s and MPF's returns 401.
    manifest: provas_manifest.yaml
    min_interval_seconds: 1.5
    notes: >
      Official provas from public bodies that publish their own concursos. Each entry
      is self-contained — the answer grid is either inside the prova or a companion
      file named in the entry — so there is no discovery step to break.

  - id: oab-1f-penal
    adapter: oab_1f
    # Same host and the same two levels of GET as `oab-2f-penal` — the OAB publishes
    # the 1ª-fase cadernos and gabaritos on the very pages that adapter already walks.
    # Never construct one of the PDF URLs by pattern: they are opaque CDN UUIDs and
    # every one of them comes from an <a href> on the exam's own index page.
    seed_url: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame=0
    exam_url_template: https://examedeordem.oab.org.br/EditaisProvas?NumeroExame={exam_id}
    # An exam publishes four shuffled tipos of the same 80 questions. Tipo 1 is the
    # one the answer grid is written around and the one the correspondence table maps
    # from, so one tipo is harvested and the other three are only read to cross-check
    # the grid (see `read_tipo_grid`).
    tipo: 1
    # Milestone scope: 29 exams publish a Tipo 1 caderno, 19 of them 2019 or later,
    # and all 19 of those also publish a 1ª-fase gabarito (Task 1 recon). The older
    # ten are a separate recon, not a config flip — several are reaplicações whose
    # index page carries two full administrations, which `select_1f_artifacts`
    # refuses on purpose. The year itself comes from the caderno's index entry and
    # is load-bearing: an exam whose entry carries no date is skipped, because a
    # null exam_year silently disables the law watchlist for the whole exam.
    min_exam_year: 2019
    columns: 2
    format: mcq4
    # Candidate item anchors, best-of measured per exam (see `choose_item_style`).
    # 17 of the 19 in-scope cadernos number a question with a bare numeral on its own
    # line; the XXVIII and XXIX (2019) write "Questão N" instead. One value cannot
    # cover both, and neither can a per-exam map that a new exam would silently miss.
    #
    # A typo here aborts the whole run rather than costing one exam: `segment_objetiva`
    # raises on an unknown style and nothing catches it. That is deliberate — every
    # other failure in this adapter is per-exam because it is a fact about one PDF,
    # but a misspelt anchor is a fact about the config and would mis-segment all 18
    # exams identically. Failing on the first is the only way anyone finds out.
    item_style: [bare, questao]
    # Excluded by name, deliberately. Measured on the XXXV (2022): its text layer is
    # partly unmapped glyphs, only 65 of its 80 items segment at all, and the per-item
    # health check catches just 2 of those (q56, q68). The other 63 are legible legal
    # Portuguese — 15 of them reach the keyword gate — so the exclusion is NOT there
    # because the surviving items are corrupt prose. It is there because 15 of 80 is a
    # quarter of an exam, silently: 15 items would be attributed to the XXXV Exame as
    # if that were its criminal yield, when 65 of its 80 questions were never read.
    # Nine of the 15 also carry a stray `(cid:NNNN)` page-number glyph in their last
    # alternative; the furniture list scrubs that shape (see the `(cid:` fragment
    # below), so it is not the reason either.
    exclude_exam_ids: ["13415"]
    min_interval_seconds: 1.5
    banca: FGV
    carreira: oab
    # Running heads, page numbers and the trailing "questionário de percepção" the
    # OAB prints inside the question area. Left in place they are spliced verbatim
    # into a legal alternative — 1,784 foreign lines across the 18 ingestible exams,
    # measured offline. Per source, never in `parse/objetiva.py`, which every other
    # source shares. Fragments are matched line-wise and case-insensitively; the ones
    # written with ^...$ are whole-line by design, because "EXAME DE ORDEM UNIFICADO"
    # and "resultado final do exame." also occur inside real questions.
    furniture:
      - '^[ \t]*[\wÀ-ÿ]*[ \t]*EXAME\s+D[EO]\s+ORDEM\s+UN\w*[ \t]*$'
      - '^[ \t]*\w*FICADO\s*[–—-]\s*TIPO\b.*$'
      - '^[ \t]*PROVA\s+APLICAD\w*[ \t]*$'
      - '^[ \t]*D?A\s+EM\s+\d{1,2}/\d{1,2}/\d{4}[ \t]*$'
      - '^[ \t]*.?[ \t]*TIPO\s*(?:0?\d)?\s*[–—-]?\s*BRANCA\b.*$'
      - '^[ \t]*[–—-]?\s*P[ÁA]GINA\s*\d*[ \t]*$'
      # The aggressive one, and the one most likely to cost legal text on some future
      # caderno: it strips ANY bare 1-3 digit line. Today every single removal across
      # the 19 exams is a page number (0-26) sitting at the end of the last alternative
      # on a page, but an exam that typesets a numbered table or a matching list inside
      # a stem would lose those numerals. If that ever happens, narrow it to a trailing
      # position rather than deleting it — page numbers are worth stripping.
      - '^[ \t]*\d{1,3}[ \t]*$'
      # The same page number when its glyphs did not map: `(cid:1013)`, `1(cid:1012)`.
      # Deliberately whole-line, not a bare `\(cid:\d+\)`: measured across the one
      # exam that has this artefact (13415, 9 occurrences), it is always a line of
      # nothing but glyphs. An unanchored fragment would instead delete any line where
      # a single glyph failed to map — losing real legal text silently, which is worse
      # than shipping a visible `(cid:N)` the professor can see in the shortlist.
      - '^[ \t]*\d{0,2}[ \t]*(?:\(cid:\d+\)[ \t]*)+$'
      - 'QUESTION[ÁA]RIO\s+DE\s+PERCEP[ÇC][ÃA]O\s+SOBRE\s+A\s+PRO'
      - 'Este\s+question[áa]rio\s+[ée]\s+de\s+preenchimento\s+facultativo'
      - '^[ \t]*exame\.[ \t]*$'
      - '^[ \t]*resultado\s+final\s+do\s+exame\.[ \t]*$'
      - 'Como\s+se\s+trata\s+de\s+mera\s+pesquisa'
      - 'As\s+quest[õo]es\s+t[êe]m\s+como\s+objetivo\s+avaliar\s+a\s+qualidade'
      - 'adequa[çc][ãa]o\s+d[ae]\s*$'
      - 'prova\s+que\s+voc[êe]\s+acabou\s+de\s+realizar'
      - 'Assinale\s+suas\s+respostas\s+nos\s+espa[çc]os\s+pr[óo]prios'
      - 'd[ae]?\s*sua\s+folha\s+de\s+respostas'
      - 'A\s+OAB\s+e\s+a\s+FGV\s+agradecem'
    # Professor-approved. A 1ª-fase caderno is 80 questions across ~14 disciplines with
    # no headings to bind on, so criminal material is found by vocabulary. Maintained
    # here, never in code: `is_criminal` takes both values as arguments.
    min_keyword_hits: 2
    keep_keywords:
      - CPP
      - processo penal
      - inquérito
      - flagrante
      - preventiva
      - temporária
      - audiência de custódia
      - denúncia
      - queixa-crime
      - resposta à acusação
      - absolvição sumária
      - nulidade
      - prova ilícita
      - interceptação
      - habeas corpus
      - júri
      - pronúncia
      - apelação
      - recurso em sentido estrito
      - competência
      - Ministério Público
      - delegado
      - réu
      - acusado
      - sentença penal
      - execução penal
      - código penal
      - crime
      - criminal
      - delito
      - penal
      - pena
      - dosimetria
      - prescrição da pretensão punitiva
      - tipicidade
      - dolo
      - culposo
      - legítima defesa
      - furto
      - roubo
      - homicídio
      - estelionato
      - tráfico
      - lei de drogas
      - condenação
      - condenado
      - absolvição
      - prisão
      - delegacia
      - autoridade policial
      - vítima
      - ofendido
      - querelante
      - querelado
      - indiciado
      - investigado
      - defensor
      - defensoria pública
      - juizado especial criminal
      - transação penal
      - suspensão condicional
      - acordo de não persecução
      - boletim de ocorrência
      - reincidente
      - regime fechado
      - regime semiaberto
      - regime aberto
      - livramento condicional
      - delação
      - colaboração premiada
      - busca e apreensão
      - mandado de prisão
      - testemunha
      - interrogatório
      - instrução criminal
      - trânsito em julgado
      - recurso especial
      - revisão criminal
      - maria da penha
      - violência doméstica
      - improbidade
      - domicílio
      - inviolabilidade
      - busca domiciliar
      - mandado judicial
      - ilícito
      - polícia
      - policial
      - tipo penal
      - culpabilidade
      - imputável
      - antijurídico
      - tribunal do júri
    notes: >
      OAB 1ª fase, objective (A-D) questions, 2019 onward. Two PDFs per exam joined on
      the item number: the Tipo 1 caderno and the exam's best available 1ª-fase
      gabarito (definitivo when published, preliminary otherwise — a preliminary key
      sets answer_key_provisional). Measured offline over the 19 in-scope exams: 18
      ingestible, 1,439 items recovered, 405 kept by the keyword gate, 5 of them
      officially annulled.

      `bqpp parse --source oab-1f-penal` needs one live `bqpp harvest` first: the
      exam index pages are not in this source's cache directory until then, and an
      offline run has nothing to enumerate from. It fails loudly and writes nothing.
